name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile source
        run: python -m py_compile __init__.py node.py h3_client.py

      - name: Verify generated workflows
        run: python scripts/generate_workflows.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check repository hygiene
        run: |
          test -z "$(find . -type f -size +1M -not -path './.git/*' -print -quit)"
          ! grep -RInE 'Bearer[[:space:]]+[A-Za-z0-9_-]{16,}|H3_API_KEY=[A-Za-z0-9_-]{16,}' \
            --exclude-dir=.git --exclude-dir=__pycache__ .
